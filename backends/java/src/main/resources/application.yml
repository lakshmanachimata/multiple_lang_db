server:
  port: 8081

spring:
  application:
    name: multi-lang-backend-java
  datasource:
    url: jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  data:
    mongodb:
      host: localhost
      port: 27017
      database: taskdb

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-signing-change-in-prod}
  expiration-ms: 86400000
